<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<!-- Meta Pixel (consent-gated) -->
<script src="assets/pixel.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail" data-bg-color="#0c0e0a"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#efece4">WK</text></svg></template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&amp;family=Courier+Prime&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0c0e0a;color:#efece4;}
a{color:#efece4;text-decoration:none;}
a:hover{color:#f2a65a;}
</style>
</helmet>
<div style="min-height:100vh;background:#0c0e0a;font-family:'Archivo Narrow',sans-serif;">
  <section data-screen-label="Hero" style="position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;padding:{{ framePad }};box-sizing:border-box;">
    <div style="position:relative;width:100%;height:100%;overflow:hidden;border-radius:{{ frameRadius }};">
      <img src="assets/willa-hero.jpg" alt="Willa Kaplan" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;">
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(12,14,10,0.55) 0%, rgba(12,14,10,0) 30%, rgba(12,14,10,0.15) 50%, rgba(12,14,10,0) 70%, rgba(12,14,10,0.6) 100%);"></div>
      <img src="assets/logo-v2.png" alt="Willa Kaplan" style="position:absolute;left:50%;top:{{ logoTop }};transform:translateX(-50%);width:min(400px,62vw,36svh);">
      <div data-screen-label="Release" style="position:absolute;left:0;right:0;bottom:calc(max(56px,10svh) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:20px;padding:0 24px;text-align:center;">
        <h2 style="margin:0;font-family:'Courier Prime',monospace;font-weight:400;font-size:clamp(20px,2.6vw,32px);line-height:1.15;letter-spacing:0.12em;text-transform:uppercase;text-shadow:0 2px 24px rgba(12,14,10,0.45);text-wrap:balance;">Nothing's Sacred Out Now</h2>
        <a href="https://music.willakaplan.com/nothings-sacred" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 40px;background:#efece4;color:#0c0e0a;font-family:'Courier Prime',monospace;font-size:16px;letter-spacing:0.2em;text-transform:uppercase;" style-hover="background:#f2a65a;color:#0c0e0a;">Listen</a>
      </div>
    </div>
  </section>
  <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Cookie consent" style="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;max-width:560px;margin:0 auto;background:#0c0e0a;border:1px solid #efece4;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;font-family:'Courier Prime',monospace;font-size:14px;line-height:1.5;color:#efece4;">
      <p style="margin:0;text-wrap:pretty;">This site uses cookies (Meta Pixel) to measure visits and improve ads. Accept to allow them, or decline to browse without them.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button onClick="{{ accept }}" style="min-height:44px;padding:0 24px;background:#efece4;color:#0c0e0a;border:0;font-family:'Courier Prime',monospace;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;" style-hover="background:#f2a65a;">Accept</button>
        <button onClick="{{ decline }}" style="min-height:44px;padding:0 24px;background:transparent;color:#efece4;border:1px solid #efece4;font-family:'Courier Prime',monospace;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;" style-hover="color:#f2a65a;border-color:#f2a65a;">Decline</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showSettingsLink }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ reopen }}" style="position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;background:transparent;border:0;padding:8px;color:#b9b6ad;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;" style-hover="color:#f2a65a;">Cookies</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Full bleed&quot;,&quot;Framed&quot;],&quot;default&quot;:&quot;Full bleed&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PIXEL_ID = '1128693672952683';
const CONSENT_KEY = 'wk-cookie-consent';
function loadPixel() {
  if (window.fbq) window.fbq('consent', 'grant');
}
function clearMetaCookies() {
  ['_fbp', '_fbc'].forEach(n => {
    const host = location.hostname, root = host.split('.').slice(-2).join('.');
    [host, '.' + host, '.' + root].forEach(d => { document.cookie = n + '=; Max-Age=0; path=/; domain=' + d; });
    document.cookie = n + '=; Max-Age=0; path=/';
  });
}
class Component extends DCLogic {
  state = { consent: null, ready: false, open: false };
  componentDidMount() {
    let c = null;
    try { c = localStorage.getItem(CONSENT_KEY); } catch (e) {}
    if (c === 'granted') loadPixel();
    this.setState({ consent: c, ready: true });
  }
  setConsent(v) {
    try { localStorage.setItem(CONSENT_KEY, v); } catch (e) {}
    if (v === 'granted') loadPixel();
    else { if (window.fbq) window.fbq('consent', 'revoke'); clearMetaCookies(); }
    this.setState({ consent: v, open: false });
  }
  renderVals() {
    const { consent, ready } = this.state;
    const cookieVals = {
      showBanner: ready && this.state.open,
      showSettingsLink: ready && !this.state.open,
      accept: () => this.setConsent('granted'),
      decline: () => this.setConsent('denied'),
      reopen: () => this.setState({ open: true })
    };
    const framed = (this.props.layout ?? 'Full bleed') === 'Framed';
    return {
      ...cookieVals,
      framePad: framed ? 'clamp(16px,3vw,40px)' : '0',
      frameRadius: framed ? '28px' : '0',
      logoTop: framed ? 'calc(12svh + env(safe-area-inset-top))' : 'calc(max(72px, 14svh) + env(safe-area-inset-top))'
    };
  }
}
</script>
</body>
</html>
